name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run lint
          - name: Bun type check
            command: bun run typecheck
          - name: TypeScript compiler
            command: bun run typecheck:tsc
          - name: Storage tests
            command: bun run test
          - name: npm publish dry run
            command: bun run publish:check
          - name: Application build
            command: bun run build
          - name: Electron UI tests
            command: bun run test:ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  react-doctor:
    name: React Doctor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: React Doctor
        run: bun run react-doctor
